name: eonweb

services:
  web:
    image: node:22-slim
    working_dir: /app
    init: true
    environment:
      ASTRO_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:4321:4321'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    command: npm run dev -- --host 0.0.0.0

volumes:
  node_modules:
  npm_cache:
